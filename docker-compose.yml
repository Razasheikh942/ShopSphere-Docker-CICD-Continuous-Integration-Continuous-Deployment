version: '3.8'

services:
  # ---------- INFRASTRUCTURE ----------
  mongodb:
    image: mongo:7
    container_name: mongodb
    restart: always
    environment:
      MONGO_INITDB_ROOT_USERNAME: root
      MONGO_INITDB_ROOT_PASSWORD: root
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    networks:
      - shopsphere-net

  redis:
    image: redis:7-alpine
    container_name: redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    networks:
      - shopsphere-net

  # ---------- MICROSERVICES ----------
  user-service:
    build:
      context: .
      dockerfile: user-service/Dockerfile
    container_name: user-service
    restart: always
    ports:
      - "8083:8083"
    environment:
      - MONGODB_HOST=mongodb
      - REDIS_HOST=redis
    depends_on:
      - mongodb
      - redis
    networks:
      - shopsphere-net

  product-service:
    build:
      context: .
      dockerfile: product-service/Dockerfile
    container_name: product-service
    restart: always
    ports:
      - "8081:8081"
    environment:
      - MONGODB_HOST=mongodb
      - REDIS_HOST=redis
    depends_on:
      - mongodb
      - redis
    networks:
      - shopsphere-net

  order-service:
    build:
      context: .
      dockerfile: order-service/Dockerfile
    container_name: order-service
    restart: always
    ports:
      - "8082:8082"
    environment:
      - MONGODB_HOST=mongodb
      - REDIS_HOST=redis
    depends_on:
      - mongodb
      - redis
    networks:
      - shopsphere-net

  cart-service:
    build:
      context: .
      dockerfile: cart-service/Dockerfile
    container_name: cart-service
    restart: always
    ports:
      - "8084:8084"
    environment:
      - MONGODB_HOST=mongodb
      - REDIS_HOST=redis
    depends_on:
      - mongodb
      - redis
    networks:
      - shopsphere-net

  payment-service:
    build:
      context: .
      dockerfile: payment-service/Dockerfile
    container_name: payment-service
    restart: always
    ports:
      - "8085:8085"
    environment:
      - MONGODB_HOST=mongodb
      - REDIS_HOST=redis
    depends_on:
      - mongodb
      - redis
    networks:
      - shopsphere-net

  shipping-service:
    build:
      context: .
      dockerfile: shipping-service/Dockerfile
    container_name: shipping-service
    restart: always
    ports:
      - "8086:8086"
    environment:
      - MONGODB_HOST=mongodb
      - REDIS_HOST=redis
    depends_on:
      - mongodb
      - redis
    networks:
      - shopsphere-net

  notification-service:
    build:
      context: .
      dockerfile: notification-service/Dockerfile
    container_name: notification-service
    restart: always
    ports:
      - "8087:8087"
    environment:
      - MONGODB_HOST=mongodb
      - REDIS_HOST=redis
    depends_on:
      - mongodb
      - redis
    networks:
      - shopsphere-net

  review-service:
    build:
      context: .
      dockerfile: review-service/Dockerfile
    container_name: review-service
    restart: always
    ports:
      - "8088:8088"
    environment:
      - MONGODB_HOST=mongodb
      - REDIS_HOST=redis
    depends_on:
      - mongodb
      - redis
    networks:
      - shopsphere-net

  api-gateway:
    build:
      context: .
      dockerfile: api-gateway/Dockerfile
    container_name: api-gateway
    restart: always
    ports:
      - "8080:8080"
    depends_on:
      - user-service
      - product-service
      - order-service
      - cart-service
      - payment-service
      - shipping-service
      - notification-service
      - review-service
    networks:
      - shopsphere-net

  # ---------- FRONTEND ----------
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: frontend
    restart: always
    ports:
      - "3000:80"
    depends_on:
      - api-gateway
    networks:
      - shopsphere-net

networks:
  shopsphere-net:
    driver: bridge

volumes:
  mongo-data:
  redis-data: