name: CICD pipeline for shopsphere

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:

  build:
    runs-on: ubuntu-latest
    steps:
      - name: code checkout
        uses: actions/checkout@v4

      - name: setup java
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: temurin
          cache: maven

      - name: build parent pom
        run: mvn clean install -N -DskipTests

      - name: build common module
        run: cd common && mvn clean install -DskipTests

      - name: build api-gateway
        run: cd api-gateway && mvn clean package -DskipTests

      - name: build cart-service
        run: cd cart-service && mvn clean package -DskipTests

      - name: build notification-service
        run: cd notification-service && mvn clean package -DskipTests

      - name: build order-service
        run: cd order-service && mvn clean package -DskipTests

      - name: build payment-service
        run: cd payment-service && mvn clean package -DskipTests

      - name: build product-service
        run: cd product-service && mvn clean package -DskipTests

      - name: build review-service
        run: cd review-service && mvn clean package -DskipTests

      - name: build shipping-service
        run: cd shipping-service && mvn clean package -DskipTests

      - name: build user-service
        run: cd user-service && mvn clean package -DskipTests

  docker-push:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: code checkout
        uses: actions/checkout@v4

      - name: docker login
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: build and push api-gateway
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./api-gateway/Dockerfile
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/shopsphere-api-gateway:latest

      - name: build and push cart-service
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./cart-service/Dockerfile
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/shopsphere-cart-service:latest

      - name: build and push notification-service
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./notification-service/Dockerfile
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/shopsphere-notification-service:latest

      - name: build and push order-service
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./order-service/Dockerfile
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/shopsphere-order-service:latest

      - name: build and push payment-service
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./payment-service/Dockerfile
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/shopsphere-payment-service:latest

      - name: build and push product-service
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./product-service/Dockerfile
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/shopsphere-product-service:latest

      - name: build and push review-service
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./review-service/Dockerfile
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/shopsphere-review-service:latest

      - name: build and push shipping-service
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./shipping-service/Dockerfile
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/shopsphere-shipping-service:latest

      - name: build and push user-service
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./user-service/Dockerfile
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/shopsphere-user-service:latest

  # CD Part
  deploy:
    runs-on: ubuntu-latest
    needs: docker-push
    steps:
      - name: Deploy on EC2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            cd ~/ShopSphere-Docker-CICD-Continuous-Integration-Continuous-Deployment
            git pull origin main
            docker compose up -d --build
            docker system prune -f
